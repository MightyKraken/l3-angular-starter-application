<aside
	[class.sidebar-mini]="isSidebarMini()"
	class="box-border flex h-full min-h-0 w-[var(--sidebar-width)] min-w-[var(--sidebar-width)] flex-1 flex-col overflow-x-hidden bg-base-100 text-base-content transition-[inline-size,min-inline-size] duration-[220ms] ease-in-out"
>
	@if (showSidebarToggle()) {
	<header
		[class.justify-center]="isSidebarMini() || isSidebarHidden()"
		class="flex shrink-0 items-center border-b border-base-content/10 px-2 py-2"
	>
		<app-sidebar-menu-toggle />
	</header>
	}
	<nav
		[class.hidden]="isSidebarHidden() && showSidebarToggle()"
		class="flex-1 overflow-y-auto py-4"
	>
		<ul
			[class.items-center]="isSidebarMini()"
			class="m-0 flex list-none flex-col gap-1 p-0"
		>
			@for (item of navigationTree; track item.id) {
			<li
				[collapsedLabels]="isSidebarMini()"
				[depth]="0"
				[node]="item"
				app-nav-tree-item
			></li>
			}
		</ul>
	</nav>
</aside>
