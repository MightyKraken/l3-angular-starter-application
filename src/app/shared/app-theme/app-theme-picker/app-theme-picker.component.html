<button
	[matMenuTriggerFor]="themeMenu"
	aria-label="Choose theme"
	class="btn btn-circle btn-ghost border-0 text-base-content hover:bg-base-content/10 active:bg-base-content/20"
	type="button"
>
	<app-icon name="palette" />
</button>

<mat-menu
	#themeMenu="matMenu"
	aria-label="Themes"
	class="theme-picker-menu max-h-80 w-52 max-w-52 overflow-hidden"
	xPosition="before"
>
	@for (theme of themes; track theme.id) {
	<button
		[attr.aria-label]="theme.label + ' theme'"
		[class.btn-active]="isActive(theme.id)"
		(click)="onSelect(theme.id)"
		class="theme-picker-menu-item btn btn-ghost h-auto min-h-10 w-full justify-start gap-3 border-0 py-2 font-normal"
		disableRipple
		mat-menu-item
		type="button"
	>
		<app-theme-preview [themeId]="theme.id" />
		<span class="min-w-0 flex-1 truncate text-start text-sm font-medium"
			>{{ theme.label }}</span
		>
		<app-icon
			[class.invisible]="!isActive(theme.id)"
			class="size-3 shrink-0"
			name="check"
		/>
	</button>
	}
</mat-menu>
