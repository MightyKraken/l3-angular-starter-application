<mat-button-toggle-group
	[value]="layoutMode()"
	(change)="select($event.value)"
	aria-label="Application layout"
	class="radio-card-group radio-card-group-horizontal radio-card-group-align-center"
	hideSingleSelectionIndicator
>
	@for (option of options; track option.id) {
	<mat-button-toggle
		[aria-label]="option.label + '. ' + option.description"
		[value]="option.id"
		class="radio-card-option"
		disableRipple
	>
		@if (option.id === appLayoutModes.toolbarTop) {
		<span
			aria-hidden="true"
			class="grid h-12 w-16 grid-rows-2 gap-0.5 rounded bg-base-content/6 p-0.5"
		>
			<span class="h-3 rounded-sm bg-base-content/55"></span>
			<span class="grid min-h-0 grid-cols-2 gap-0.5">
				<span class="w-4 rounded-sm bg-base-content/35"></span>
				<span class="rounded-sm bg-base-content/12"></span>
			</span>
		</span>
		} @else {
		<span
			aria-hidden="true"
			class="grid h-12 w-16 grid-cols-2 gap-0.5 rounded bg-base-content/6 p-0.5"
		>
			<span class="w-4 rounded-sm bg-base-content/35"></span>
			<span class="grid min-w-0 grid-rows-2 gap-0.5">
				<span class="h-3 rounded-sm bg-base-content/55"></span>
				<span class="rounded-sm bg-base-content/12"></span>
			</span>
		</span>
		}
		<span class="text-center text-xs leading-snug font-medium"
			>{{ option.label }}</span
		>
	</mat-button-toggle>
	}
</mat-button-toggle-group>
