<mat-button-toggle-group
	[value]="layoutMode()"
	(change)="select($event.value)"
	aria-label="Application layout"
	class="radio-card-group radio-card-group-horizontal radio-card-group-align-center"
	hideSingleSelectionIndicator
>
	@for (option of options; track option.id) {
	<mat-button-toggle
		[aria-label]="option.label + '. ' + option.description"
		[value]="option.id"
		class="radio-card-option"
		disableRipple
	>
		@if (option.id === appLayoutModes.toolbarTop) {
		<span
			aria-hidden="true"
			class="grid h-12 w-16 grid-rows-[auto_1fr] gap-px overflow-hidden rounded bg-base-content/15 p-px"
		>
			<span class="h-3 shrink-0 bg-base-content/55"></span>
			<span class="grid min-h-0 grid-cols-[1fr_3fr] gap-px">
				<span class="bg-base-content/35"></span>
				<span class="bg-base-content/12"></span>
			</span>
		</span>
		} @else {
		<span
			aria-hidden="true"
			class="grid h-12 w-16 grid-cols-[1fr_3fr] gap-px overflow-hidden rounded bg-base-content/15 p-px"
		>
			<span class="bg-base-content/35"></span>
			<span class="grid min-h-0 min-w-0 grid-rows-[auto_1fr] gap-px">
				<span class="h-3 shrink-0 bg-base-content/55"></span>
				<span class="bg-base-content/12"></span>
			</span>
		</span>
		}
		<span class="text-center text-xs leading-snug font-medium"
			>{{ option.label }}</span
		>
	</mat-button-toggle>
	}
</mat-button-toggle-group>
