<nav
	class="box-border w-full max-w-full bg-base-100 px-4 text-base-content shadow-sm shadow-base-content/10"
>
	<div
		class="box-border flex h-[var(--toolbar-height)] w-full min-w-0 max-w-full items-center gap-4"
	>
		<div [attr.data-tip]="toggleTooltip()" class="tooltip tooltip-right">
			<button
				[attr.aria-label]="toggleAriaLabel()"
				(click)="onMenuToggle()"
				class="btn btn-circle btn-ghost border-0 text-base-content hover:bg-base-content/10 active:bg-base-content/20"
				type="button"
			>
				<app-icon name="list" />
			</button>
		</div>
		<app-icon ariaLabel="Company logo" name="angular" source="asset" />
		<span
			class="min-w-0 flex-1 overflow-hidden text-base font-medium text-ellipsis whitespace-nowrap"
			>{{ appTitle() }}</span
		>
		<div class="ms-auto flex shrink-0 items-center gap-2">
			<app-theme-picker />
		</div>
	</div>
</nav>
