<div
	[attr.aria-label]="'Sidebar toggle behavior'"
	class="flex flex-col gap-3"
	role="radiogroup"
>
	@for (option of options; track option.id) {
	<button
		[attr.aria-checked]="isActive(option.id)"
		[attr.aria-label]="option.label + '. ' + option.description"
		[class.app-selectable-option-active]="isActive(option.id)"
		(click)="select(option.id)"
		class="app-selectable-option flex flex-col items-start gap-1.5 px-4 py-3.5 text-start"
		role="radio"
		type="button"
	>
		<span class="text-[0.9375rem] leading-snug font-semibold"
			>{{ option.label }}</span
		>
		<span
			class="text-[0.8125rem] leading-snug font-normal text-[color-mix(in_srgb,var(--app-on-surface)_70%,transparent)]"
			>{{ option.description }}</span
		>
	</button>
	}
</div>
