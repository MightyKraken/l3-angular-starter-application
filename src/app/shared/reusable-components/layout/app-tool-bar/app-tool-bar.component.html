<nav
	class="box-border w-full max-w-full bg-primary px-4 text-primary-content shadow-[0_2px_4px_color-mix(in_oklch,var(--color-primary-content)_15%,transparent)]"
>
	<div
		class="box-border flex h-[var(--toolbar-height)] w-full max-w-full min-w-0 items-center gap-4"
	>
		<app-icon-button
			[ariaLabel]="toggleAriaLabel()"
			[matTooltip]="toggleAriaLabel()"
			(clicked)="onMenuToggle()"
			icon="list"
		/>
		<app-icon ariaLabel="Company logo" name="angular" source="asset" />
		<span
			class="min-w-0 flex-1 overflow-hidden text-base font-medium text-ellipsis whitespace-nowrap"
			>{{ appTitle() }}</span
		>
		<div class="ms-auto flex shrink-0 items-center gap-2">
			<app-theme-picker />
		</div>
	</div>
</nav>
