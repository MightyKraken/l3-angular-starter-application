<nav class="app-toolbar">
	<div class="app-toolbar-inner">
		<div [attr.data-tip]="toggleTooltip()" class="tooltip tooltip-right">
			<button
				[attr.aria-label]="toggleAriaLabel()"
				(click)="onMenuToggle()"
				class="btn btn-circle btn-ghost app-toolbar-icon-btn border-0"
				type="button"
			>
				<app-icon name="list" />
			</button>
		</div>
		<app-icon ariaLabel="Company logo" name="angular" source="asset" />
		<span class="app-toolbar-title">{{ appTitle() }}</span>
		<div class="ms-auto flex shrink-0 items-center gap-2">
			<app-theme-picker />
		</div>
	</div>
</nav>
