<aside [class.sidebar-mini]="isSidebarMini()" class="sidebar">
	<nav class="sidebar-nav">
		<ul class="nav-tree">
			@for (item of navigationTree; track item.id) {
			<li
				[collapsedLabels]="isSidebarMini()"
				[depth]="0"
				[node]="item"
				app-nav-tree-item
			></li>
			}
		</ul>
	</nav>
</aside>
