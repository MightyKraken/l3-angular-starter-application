<aside [class.sidebar-mini]="isSidebarMini()" class="app-sidebar">
	<nav class="app-sidebar-nav">
		<ul class="app-sidebar-list">
			@for (item of navigationTree; track item.id) {
			<li
				[collapsedLabels]="isSidebarMini()"
				[depth]="0"
				[node]="item"
				app-nav-tree-item
			></li>
			}
		</ul>
	</nav>
</aside>
