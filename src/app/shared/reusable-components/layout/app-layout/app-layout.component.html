<!-- Content With Navigation And Toolbar-->
@if (showNavigation() && showToolbar()) {
<div
	[attr.data-layout]="layoutMode()"
	[attr.data-sidebar-mode]="sidebarMode()"
	[attr.data-sidebar-overlay]="isSidebarOverlay() ? '' : null"
	[class.toolbar-collapsed]="isToolbarHidden()"
	class="grid"
>
	@if (isSidebarOverlay()) {
		<button
			[class.sidebar-backdrop-visible]="sidebarMode() !== 'hidden'"
			(click)="closeSidebar()"
			aria-label="Close navigation"
			[attr.aria-hidden]="sidebarMode() === 'hidden'"
			class="sidebar-backdrop"
			type="button"
		></button>
	}
	<div class="nav"><ng-container *ngTemplateOutlet="navigationbar" /></div>
	<div [class.toolbar-hidden]="isToolbarHidden()" class="toolbar">
		<ng-container *ngTemplateOutlet="toolbar" />
	</div>
	<div #scrollContent class="content">
		<ng-container *ngTemplateOutlet="content" />
	</div>
</div>
}

<!-- Content With Navigation -->
@if (showNavigation() && !showToolbar()) {
<div>
	<ng-container *ngTemplateOutlet="navigationbar" />
	<ng-container *ngTemplateOutlet="content" />
</div>
}

<!-- Content With Toolbar-->
@if (!showNavigation() && showToolbar()) {
<div [class.toolbar-collapsed]="isToolbarHidden()" class="toolbar-only-layout">
	<div [class.toolbar-hidden]="isToolbarHidden()" class="toolbar">
		<ng-container *ngTemplateOutlet="toolbar" />
	</div>
	<div #scrollContent class="content">
		<ng-container *ngTemplateOutlet="content" />
	</div>
</div>
}

<!-- Content -->
@if (!showNavigation() && !showToolbar()) {
<ng-container *ngTemplateOutlet="content" />
}

<ng-template #content>
	<router-outlet />
</ng-template>

<ng-template #navigationbar>
	<app-navigation-bar />
</ng-template>

<ng-template #toolbar>
	<app-tool-bar />
</ng-template>
