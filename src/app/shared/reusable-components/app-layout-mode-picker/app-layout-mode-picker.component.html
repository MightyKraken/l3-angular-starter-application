<div
	[attr.aria-label]="'Application layout'"
	class="flex flex-wrap gap-3"
	role="radiogroup"
>
	@for (option of options; track option.id) {
	<button
		[attr.aria-checked]="isActive(option.id)"
		[attr.aria-label]="option.label + '. ' + option.description"
		[class.app-selectable-option-active]="isActive(option.id)"
		(click)="select(option.id)"
		class="app-selectable-option flex min-w-[7.5rem] flex-col items-center gap-2.5 p-3"
		role="radio"
		type="button"
	>
		@if (option.id === 'toolbar-top') {
		<span
			aria-hidden="true"
			class="grid h-12 w-[4.5rem] gap-0.5 rounded bg-[color-mix(in_srgb,var(--app-on-surface)_6%,transparent)] p-[3px] grid-rows-[0.75rem_1fr]"
		>
			<span
				class="rounded-sm bg-[color-mix(in_srgb,var(--app-on-surface)_55%,transparent)]"
			></span>
			<span class="grid min-h-0 grid-cols-[1.1rem_1fr] gap-0.5">
				<span
					class="rounded-sm bg-[color-mix(in_srgb,var(--app-on-surface)_35%,transparent)]"
				></span>
				<span
					class="rounded-sm bg-[color-mix(in_srgb,var(--app-on-surface)_12%,transparent)]"
				></span>
			</span>
		</span>
		} @else {
		<span
			aria-hidden="true"
			class="grid h-12 w-[4.5rem] grid-cols-[1.1rem_1fr] gap-0.5 rounded bg-[color-mix(in_srgb,var(--app-on-surface)_6%,transparent)] p-[3px]"
		>
			<span
				class="rounded-sm bg-[color-mix(in_srgb,var(--app-on-surface)_35%,transparent)]"
			></span>
			<span class="grid min-w-0 grid-rows-[0.75rem_1fr] gap-0.5">
				<span
					class="rounded-sm bg-[color-mix(in_srgb,var(--app-on-surface)_55%,transparent)]"
				></span>
				<span
					class="rounded-sm bg-[color-mix(in_srgb,var(--app-on-surface)_12%,transparent)]"
				></span>
			</span>
		</span>
		}
		<span class="text-center text-[0.8125rem] leading-snug font-medium"
			>{{ option.label }}</span
		>
	</button>
	}
</div>
