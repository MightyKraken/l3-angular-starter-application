<div class="dropdown dropdown-end">
	<div
		aria-haspopup="listbox"
		aria-label="Choose theme"
		class="btn btn-circle btn-ghost app-toolbar-icon-btn border-0"
		role="button"
		tabindex="0"
	>
		<app-icon name="palette" />
	</div>

	<ul
		aria-label="Themes"
		class="menu dropdown-content theme-picker-menu z-[1] mt-2 flex max-h-80 w-52 flex-col flex-nowrap gap-0.5 overflow-x-hidden overflow-y-auto rounded-box bg-base-100 p-2 shadow-sm"
		role="listbox"
		tabindex="-1"
	>
		@for (theme of themes; track theme.id) {
		<li class="w-full shrink-0">
			<button
				[attr.aria-label]="theme.label + ' theme'"
				[attr.aria-selected]="isActive(theme.id)"
				[class.btn-active]="isActive(theme.id)"
				(click)="onSelect(theme.id)"
				class="btn btn-ghost h-auto min-h-10 w-full justify-start gap-3 border-0 py-2 font-normal"
				role="option"
				type="button"
			>
				<app-theme-preview [themeId]="theme.id" />
				<span class="min-w-0 flex-1 truncate text-start text-sm font-medium"
					>{{ theme.label }}</span
				>
				<app-icon
					[class.invisible]="!isActive(theme.id)"
					class="size-3 shrink-0"
					name="check"
				/>
			</button>
		</li>
		}
	</ul>
</div>
