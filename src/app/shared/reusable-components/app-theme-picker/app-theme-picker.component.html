<div class="inline-flex text-inherit">
	<button
		[matMenuTriggerFor]="themeMenu"
		aria-label="Choose theme"
		class="inline-flex size-10 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent p-0 text-inherit transition-colors duration-200 hover:bg-primary-content/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-content/80"
		type="button"
	>
		<app-icon name="palette" />
	</button>

	<mat-menu
		#themeMenu="matMenu"
		panelClass="theme-picker-panel"
		xPosition="before"
	>
		<div
			aria-label="Themes"
			class="max-h-80 overflow-y-auto py-1"
			role="listbox"
		>
			@for (theme of themes; track theme.id) {
			<button
				[attr.aria-label]="theme.label + ' theme'"
				[attr.aria-selected]="isActive(theme.id)"
				(click)="onSelect(theme.id)"
				class="flex w-full cursor-pointer items-center gap-3 border-0 bg-transparent px-2 py-1.5 text-start text-base-content transition-colors hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-base-content/35"
				role="option"
				type="button"
			>
				<app-theme-preview [themeId]="theme.id" />
				<span class="min-w-0 flex-1 truncate text-sm font-medium"
					>{{ theme.label }}</span
				>
				<app-icon
					[class.invisible]="!isActive(theme.id)"
					class="size-3 shrink-0"
					name="check"
				/>
			</button>
			}
		</div>
	</mat-menu>
</div>
