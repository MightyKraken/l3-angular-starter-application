<div class="theme-picker">
	<button
		[matMenuTriggerFor]="themeMenu"
		aria-label="Choose theme"
		class="theme-picker-trigger"
		type="button"
	>
		<app-icon name="palette" />
	</button>

	<mat-menu
		#themeMenu="matMenu"
		panelClass="theme-picker-panel"
		xPosition="before"
	>
		<div aria-label="Theme colors" class="theme-picker-options" role="listbox">
			@for (palette of palettes; track palette.id) {
			<button
				[attr.aria-label]="palette.label + ' theme'"
				[attr.aria-selected]="isActive(palette.id)"
				[class.theme-picker-swatch-selected]="isActive(palette.id)"
				[style.background-color]="palette.previewColor"
				(click)="onSelect(palette.id)"
				class="theme-picker-swatch"
				role="option"
				type="button"
			></button>
			}
		</div>
	</mat-menu>
</div>
