<div class="inline-flex text-inherit">
	<button
		[matMenuTriggerFor]="themeMenu"
		aria-label="Choose theme"
		class="inline-flex size-10 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent p-0 text-inherit transition-colors duration-200 hover:bg-[var(--icon-button-hover-bg,color-mix(in_srgb,currentcolor_12%,transparent))] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[color-mix(in_srgb,currentcolor_80%,transparent)]"
		type="button"
	>
		<app-icon name="palette" />
	</button>

	<mat-menu
		#themeMenu="matMenu"
		panelClass="theme-picker-panel"
		xPosition="before"
	>
		<div
			aria-label="Theme colors"
			class="grid grid-cols-5 gap-3"
			role="listbox"
		>
			@for (palette of palettes; track palette.id) {
			<button
				[attr.aria-label]="palette.label + ' theme'"
				[attr.aria-selected]="isActive(palette.id)"
				[class.border-[var(--app-on-surface)]]="isActive(palette.id)"
				[style.background-color]="palette.previewColor"
				(click)="onSelect(palette.id)"
				class="size-6 cursor-pointer rounded-full border-2 border-transparent p-0 shadow-[inset_0_0_0_1px_rgb(0_0_0/12%)] transition-[transform,border-color] duration-150 hover:scale-[1.08] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[color-mix(in_srgb,var(--app-on-surface)_40%,transparent)]"
				role="option"
				type="button"
			></button>
			}
		</div>
	</mat-menu>
</div>
