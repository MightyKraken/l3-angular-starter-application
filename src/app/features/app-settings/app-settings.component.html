<section class="box-border mx-auto max-w-2xl px-6 pt-8 pb-12">
	<header class="mb-6">
		<h1 class="m-0 text-3xl font-semibold text-base-content">Settings</h1>
		<p class="mt-2 mb-0 text-sm text-base-content/65">
			Customize appearance. Quick controls stay in the toolbar.
		</p>
	</header>

	<section
		aria-labelledby="appearance-heading"
		class="rounded-xl bg-base-100 p-5 shadow-sm"
	>
		<h2
			class="m-0 mb-5 text-base font-semibold text-base-content"
			id="appearance-heading"
		>
			Appearance
		</h2>

		<div>
			<span
				class="mb-3 block text-xs font-semibold tracking-wide uppercase text-base-content/70"
				id="theme-label"
				>Theme</span
			>
			<mat-button-toggle-group
				[attr.aria-labelledby]="'theme-label'"
				[value]="themeId()"
				(change)="setTheme($event.value)"
				aria-label="Theme"
				class="radio-card-group radio-card-group--grid radio-card-group--align-center"
				hideSingleSelectionIndicator
			>
				@for (theme of themes; track theme.id) {
				<mat-button-toggle
					[aria-label]="theme.label + ' theme'"
					[value]="theme.id"
					class="radio-card-option"
					disableRipple
				>
					<app-theme-preview [themeId]="theme.id" swatchSize="md" />
					<span class="text-center text-xs leading-tight font-medium"
						>{{ theme.label }}</span
					>
				</mat-button-toggle>
				}
			</mat-button-toggle-group>
		</div>
	</section>

	<section
		aria-labelledby="layout-heading"
		class="mt-4 rounded-xl bg-base-100 p-5 shadow-sm"
	>
		<h2
			class="m-0 mb-5 text-base font-semibold text-base-content"
			id="layout-heading"
		>
			Layout
		</h2>

		<div>
			<span
				class="mb-3 block text-xs font-semibold tracking-wide uppercase text-base-content/70"
				id="layout-mode-label"
				>Shell layout</span
			>
			<app-layout-mode-picker [attr.aria-labelledby]="'layout-mode-label'" />
		</div>

		<div class="mt-6 border-t border-base-content/12 pt-6">
			<span
				class="mb-3 block text-xs font-semibold tracking-wide uppercase text-base-content/70"
				id="sidebar-toggle-label"
				>Sidebar toggle</span
			>
			<app-sidebar-toggle-picker
				[attr.aria-labelledby]="'sidebar-toggle-label'"
			/>
		</div>

		<div class="mt-6 border-t border-base-content/12 pt-6">
			<span
				class="mb-3 block text-xs font-semibold tracking-wide uppercase text-base-content/70"
				id="toolbar-behavior-label"
				>Toolbar on scroll</span
			>
			<app-toolbar-behavior-picker
				[attr.aria-labelledby]="'toolbar-behavior-label'"
			/>
		</div>
	</section>
</section>
