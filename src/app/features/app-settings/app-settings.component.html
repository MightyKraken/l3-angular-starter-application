<section class="box-border mx-auto max-w-[40rem] px-6 pt-8 pb-12">
	<header class="mb-6">
		<h1 class="m-0 text-[1.75rem] font-semibold text-base-content">Settings</h1>
		<p class="mt-2 mb-0 text-[0.9375rem] text-base-content/65">
			Customize appearance. Quick controls stay in the toolbar.
		</p>
	</header>

	<section aria-labelledby="appearance-heading" class="app-settings-card">
		<h2
			class="m-0 mb-5 text-base font-semibold text-base-content"
			id="appearance-heading"
		>
			Appearance
		</h2>

		<div>
			<span
				class="mb-3 block text-[0.8125rem] font-semibold tracking-wide uppercase text-base-content/70"
				id="theme-label"
				>Theme</span
			>
			<div
				[attr.aria-labelledby]="'theme-label'"
				class="grid grid-cols-[repeat(auto-fill,minmax(5.5rem,1fr))] gap-2.5"
				role="listbox"
			>
				@for (theme of themes; track theme.id) {
				<button
					[attr.aria-label]="theme.label + ' theme'"
					[attr.aria-selected]="isThemeActive(theme.id)"
					[class.app-selectable-option-active]="isThemeActive(theme.id)"
					(click)="setTheme(theme.id)"
					class="app-selectable-option flex flex-col items-center gap-2 border-transparent px-2 py-3"
					role="option"
					type="button"
				>
					<app-theme-preview [themeId]="theme.id" swatchSize="md" />
					<span class="text-center text-[0.8125rem] leading-tight font-medium"
						>{{ theme.label }}</span
					>
				</button>
				}
			</div>
		</div>
	</section>

	<section aria-labelledby="layout-heading" class="app-settings-card mt-4">
		<h2
			class="m-0 mb-5 text-base font-semibold text-base-content"
			id="layout-heading"
		>
			Layout
		</h2>

		<div>
			<span
				class="mb-3 block text-[0.8125rem] font-semibold tracking-wide uppercase text-base-content/70"
				id="layout-mode-label"
				>Shell layout</span
			>
			<app-layout-mode-picker [attr.aria-labelledby]="'layout-mode-label'" />
		</div>

		<div class="mt-6 border-t border-base-content/12 pt-6">
			<span
				class="mb-3 block text-[0.8125rem] font-semibold tracking-wide uppercase text-base-content/70"
				id="sidebar-toggle-label"
				>Sidebar toggle</span
			>
			<app-sidebar-toggle-picker
				[attr.aria-labelledby]="'sidebar-toggle-label'"
			/>
		</div>
	</section>
</section>
