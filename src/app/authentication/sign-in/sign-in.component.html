<div
	class="sign-in-container align-items-center justify-content-center bg-surface-ground flex min-h-screen"
>
	<p-card styleClass="w-30rem shadow-5">
		<ng-template pTemplate="header">
			<h2 class="mb-6 text-center text-3xl font-semibold">Sign In</h2>
		</ng-template>

		<form class="align-items-center justify-content-center flex flex-col gap-4">
			<div class="form-field">
				<label for="username" class="mb-2 block">Username</label>
				<input
					pInputText
					id="username"
					[(ngModel)]="username"
					name="username"
					class="w-full"
				/>
			</div>

			<div class="form-field">
				<label for="password" class="mb-2 block">Password</label>
				<p-password
					id="password"
					[(ngModel)]="password"
					name="password"
					[feedback]="false"
					[toggleMask]="true"
					styleClass="w-full"
					inputStyleClass="w-full"
				></p-password>
			</div>

			<div class="mt-4">
				<p-button
					label="Sign In"
					(onClick)="onSubmit()"
					styleClass="w-full"
				></p-button>
			</div>

			<div class="justify-content-between mt-4 flex">
				<a routerLink="/auth/signup" class="text-primary hover:underline"
					>Register</a
				>
				<a
					routerLink="/auth/reset-password"
					class="text-primary hover:underline"
					>Forgot Password?</a
				>
			</div>
		</form>
	</p-card>
</div>
