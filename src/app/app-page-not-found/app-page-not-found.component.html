<div
	data-testid="page-container"
>
	<div>
		<h1
		>
			404
		</h1>
	</div>

	<div>🔍</div>

	<h2>Page Not Found</h2>

	<p>
		Oops! The page you're looking for seems to have wandered off. Let's get you
		back on track.
	</p>

	<div>
		<a
			routerLink="/"
		>
			Go Home
		</a>
		<button
			(click)="goBack()"
			type="submit"
		>
			Go Back
		</button>
	</div>

	<div>
		<p>Need help? Try these popular pages:</p>
		<div>
			<a routerLink="/">Home</a>
			<a routerLink="/about">About</a>
			<a routerLink="/sign-in">Sign In</a>
		</div>
	</div>
</div>
